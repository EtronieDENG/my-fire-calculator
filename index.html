<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FIRE 资金支撑测算</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <section class="result-hero">
            <p class="hero-label">资金预计可支撑</p>
            <div class="hero-val-box">
                <span id="supportYears" class="hero-val">--</span>
                <span class="hero-unit">年</span>
            </div>
            <div class="chart-container">
                <canvas id="fireChart"></canvas>
            </div>
        </section>

        <main class="content">
            <section class="card">
                <div class="card-header">🏦 基础资产与支出</div>
                <div class="input-group">
                    <label>当前可投资本金 (元)</label>
                    <input type="number" id="currentSavings" placeholder="输入总存款">
                </div>
                <div class="input-group">
                    <label>FIRE 基础年消费 (元)</label>
                    <input type="number" id="annualExpense" placeholder="一年基本生活费">
                </div>
            </section>

            <section class="card">
                <div class="card-header">📈 钱生钱的能力</div>
                <div class="input-group">
                    <label>投资年收益率 (%)</label>
                    <input type="number" id="nominalReturn" step="0.1" value="2.6">
                </div>
                <div class="input-group">
                    <label>预期年化通胀 (%)</label>
                    <input type="number" id="inflationRate" step="0.1" value="3.0">
                </div>
            </section>

            <section class="card">
                <details class="milestone-details" open>
                    <summary>📁 生活里程碑 (非线性收支)</summary>
                    <div class="milestone-group">
                        <p class="sub-label">分阶段开销 (如养娃、房贷期间)</p>
                        <div id="stage-list"></div>
                        <button onclick="addRow('stage')" class="btn-ghost">+ 增加生活阶段项目</button>
                        
                        <p class="sub-label">单次大笔变动 (支出填负数 / 收入填正数)</p>
                        <div id="onetime-list"></div>
                        <button onclick="addRow('onetime')" class="btn-ghost">+ 增加单次收支项目</button>
                    </div>
                </details>
            </section>

            <section class="card note-card">
                <div class="card-header">📝 测算逻辑说明</div>
                <div class="formula-box">
                    年初本金 + 当年收益 - 实际开销 = 年末本金
                </div>
                <ul class="note-list">
                    <li>💰 **当年收益：** 年初本金 × 收益率 </li>
                    <li>📉 **实际开销：** 基础消费按通胀逐年递增，并计入大项目收支 </li>
                    <li>🏁 **终点判定：** 模拟到 **年末本金 ≤ 0** 为止 </li>
                </ul>
            </section>
        </main>

        <footer class="bottom-bar">
            <button onclick="runCoreCalculation()" class="btn-primary">开始测算</button>
            <button onclick="resetAll()" class="btn-reset">重置</button>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
