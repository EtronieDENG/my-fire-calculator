<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FIRE 资金计算器</title>
    <!-- 强制刷新缓存：版本号控制 -->
    <link rel="stylesheet" href="style.css?v=20260430">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 仪表盘：蓝色标题，结果大字居中 -->
        <header class="result-hero">
            <h1 class="app-title">FIRE 资金计算器</h1>
            <div class="hero-main">
                <p class="hero-label">资金预计可支撑</p>
                <div class="hero-val-row">
                    <span id="supportYears" class="hero-val">--</span>
                    <span class="hero-unit">年</span>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="fireChart"></canvas>
            </div>
        </header>

        <main class="content">
            <!-- 1. 基础账目：例如 300万与5万 -->
            <section class="card">
                <div class="card-header">🏦 基础资产与支出</div>
                <div class="input-group">
                    <label>当前可投资本金 (元)</label>
                    <input type="number" id="currentSavings" placeholder="例如 3,000,000">
                </div>
                <div class="input-group">
                    <label>FIRE 基础年消费 (元)</label>
                    <input type="number" id="annualExpense" placeholder="例如 50,000">
                </div>
            </section>

            <!-- 2. 收益与通胀 -->
            <section class="card">
                <div class="card-header">📈 钱生钱的能力</div>
                <div class="input-group">
                    <label>投资年收益率 (%)</label>
                    <input type="number" id="nominalReturn" step="0.1" value="2.6">
                </div>
                <div class="input-group">
                    <label>预期年通胀率 (%)</label>
                    <input type="number" id="inflationRate" step="0.1" value="3.0">
                </div>
            </section>

            <!-- 3. 生活里程碑：支持删除 -->
            <section class="card">
                <details class="milestone-details" open>
                    <summary>📁 生活里程碑 (人生大事规划)</summary>
                    <div class="milestone-group">
                        <p class="sub-label">分阶段开销 (如养娃、房贷期间)</p>
                        <div id="stage-list"></div>
                        <button onclick="addRow('stage')" class="btn-ghost">+ 增加生活阶段项目</button>
                        
                        <p class="sub-label">单次大笔变动 (支出填负 / 收入填正)</p>
                        <div id="onetime-list"></div>
                        <button onclick="addRow('onetime')" class="btn-ghost">+ 增加单次收支项目</button>
                    </div>
                </details>
            </section>

            <!-- 4. 计算说明：纯公式化视觉 -->
            <section class="card note-card">
                <div class="card-header">📝 计算说明</div>
                <div class="formula-container">
                    <div class="formula-line">
                        <span class="formula-tag">年末本金</span> = 年初本金 + 当年收益 - 实际消费 ± 大事变动
                    </div>
                    <div class="formula-line">
                        <span class="formula-tag">当年收益</span> = 年初本金 × 收益率
                    </div>
                    <div class="formula-line">
                        <span class="formula-tag">实际消费</span> = 基础消费 × (1 + 通胀率)ⁿ
                    </div>
                    <div class="formula-line status">
                        🏁 判定：年末本金 ≤ 0 → 模拟结束
                    </div>
                </div>
            </section>
        </main>

        <footer class="bottom-bar">
            <button onclick="runCoreCalculation()" class="btn-primary">开始测算</button>
            <button onclick="resetAll()" class="btn-reset">重置数据</button>
        </footer>
    </div>
    <!-- 强制刷新缓存：版本号控制 -->
    <script src="script.js?v=20260430"></script>
</body>
</html>
